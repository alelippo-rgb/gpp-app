<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale Presenze e Partite Club</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#f1f5f9;min-height:100vh}
header{background:linear-gradient(135deg,#1d4ed8,#1e3a8a);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:52px;z-index:9}
nav button{flex:1;padding:10px;border:none;border-radius:10px;background:#f1f5f9;color:#475569;font-weight:600;cursor:pointer;font-size:14px}
nav button.on{background:#1d4ed8;color:#fff}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:15px;color:#1e3a8a;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:#475569;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
textarea{min-height:110px;font-family:monospace;font-size:13px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#1d4ed8;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn.sec{background:#e2e8f0;color:#334155}
.btn.ok{background:#16a34a}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pitem{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f1f5f9}
.pitem:last-child{border:none}
.pnum{width:34px;height:34px;border-radius:50%;background:#1d4ed8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
.pname{flex:1;font-weight:600;font-size:14px}
.pitem button{background:none;border:none;font-size:16px;cursor:pointer;color:#64748b}
.att{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f1f5f9}
.att label{margin:0;flex:1;font-weight:600;font-size:14px;color:#0f172a;cursor:pointer}
.att input[type=checkbox]{width:22px;height:22px;accent-color:#16a34a;cursor:pointer}
.msg{padding:10px;border-radius:10px;font-size:13px;font-weight:600;margin-top:8px}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}
.hidden{display:none}
.spin{color:#64748b;text-align:center;padding:30px;font-size:14px}
details summary{cursor:pointer;font-weight:700;color:#1e3a8a;font-size:14px;padding:6px 0}
</style>
</head>
<body>
<header>
  <h1>⚽ GPP Club</h1>
  <button id="btnLogout" class="hidden" onclick="logout()">Esci</button>
</header>
<nav id="nav" class="hidden">
  <button id="tabRosa" class="on" onclick="showTab('rosa')">👥 Rosa</button>
  <button id="tabPres" onclick="showTab('pres')">✅ Presenze</button>
</nav>
<main>
  <div id="viewAuth">
    <div class="card"><h2>Accedi</h2>
      <label>Email</label><input type="email" id="logEmail">
      <label>Password</label><input type="password" id="logPass">
      <button class="btn" onclick="doLogin()">Entra</button><div id="logMsg"></div>
    </div>
    <div class="card"><h2>Prima volta? Crea la tua società</h2>
      <label>Email</label><input type="email" id="regEmail">
      <label>Password (min 6)</label><input type="password" id="regPass">
      <label>Nome società</label><input type="text" id="regClub">
      <label>Tuo nome</label><input type="text" id="regName">
      <button class="btn ok" onclick="doRegister()">Crea società e account</button><div id="regMsg"></div>
    </div>
  </div>
  <div id="viewOnboard" class="hidden">
    <div class="card"><h2>Completa la registrazione</h2>
      <label>Nome società</label><input type="text" id="obClub">
      <label>Tuo nome</label><input type="text" id="obName">
      <button class="btn ok" onclick="doOnboard()">Crea la società</button><div id="obMsg"></div>
    </div>
  </div>
  <div id="viewRosa" class="hidden">
    <div class="card"><h2>Aggiungi giocatore</h2>
      <div class="row"><div><label>Numero</label><input type="number" id="npNum"></div><div><label>Cognome</label><input type="text" id="npCogn"></div><div><label>Nome</label><input type="text" id="npNome"></div></div>
      <div class="row"><div><label>Nascita</label><input type="date" id="npBirth"></div><div><label>Scadenza visita</label><input type="date" id="npMed"></div></div>
      <div class="row"><div><label>Telefono</label><input type="tel" id="npTel"></div><div><label>Tel. madre</label><input type="tel" id="npTelM"></div><div><label>Tel. padre</label><input type="tel" id="npTelP"></div></div>
      <details><summary>Altri dati (FIGC, documenti, note)</summary>
        <div class="row"><div><label>Matricola FIGC</label><input type="text" id="npFigc"></div><div><label>Documento</label><input type="text" id="npDoc"></div></div>
        <div class="row"><div><label>Tessera</label><input type="text" id="npCard"></div><div><label>Note</label><input type="text" id="npNote"></div></div>
      </details>
      <button class="btn" onclick="addPlayer()">＋ Aggiungi alla rosa</button><div id="npMsg"></div>
    </div>
    <div class="card"><h2>Importa in blocco (copia da Excel/Foglio)</h2>
      <label>Incolla una riga per giocatore, campi separati da punto e virgola:<br>NUMERO; COGNOME NOME; NASCITA; SCADENZA VISITA; TEL; TEL MADRE; TEL PADRE; FIGC; DOC; TESSERA; NOTE</label>
      <textarea id="bulkText" placeholder="1; ANDREUCCI FABIO; 31/05/2013; 14/07/2027; 3331234567; 3339876543; 3335554433;;; ;"></textarea>
      <button class="btn sec" onclick="bulkImport()">⬇️ Importa righe incollate</button><div id="bulkMsg"></div>
    </div>
    <div class="card hidden" id="editCard"><h2>Modifica giocatore</h2>
      <div class="row"><div><label>Numero</label><input type="number" id="edNum"></div><div><label>Cognome</label><input type="text" id="edCogn"></div><div><label>Nome</label><input type="text" id="edNome"></div></div>
      <div class="row"><div><label>Nascita</label><input type="date" id="edBirth"></div><div><label>Scadenza visita</label><input type="date" id="edMed"></div></div>
      <div class="row"><div><label>Telefono</label><input type="tel" id="edTel"></div><div><label>Tel. madre</label><input type="tel" id="edTelM"></div><div><label>Tel. padre</label><input type="tel" id="edTelP"></div></div>
      <div class="row"><div><label>Matricola FIGC</label><input type="text" id="edFigc"></div><div><label>Documento</label><input type="text" id="edDoc"></div></div>
      <div class="row"><div><label>Tessera</label><input type="text" id="edCard"></div><div><label>Note</label><input type="text" id="edNote"></div></div>
      <button class="btn ok" onclick="saveEdit()">💾 Salva modifiche</button>
      <button class="btn sec" onclick="closeEdit()">Annulla</button><div id="edMsg"></div>
    </div>
    <div class="card"><h2>Rosa (<span id="rosaCount">0</span>) — tocca un giocatore per modificarlo</h2>
      <div id="rosaList"><div class="spin">Caricamento…</div></div>
    </div>
  </div>
  <div id="viewPres" class="hidden">
    <div class="card"><h2>Presenze allenamento</h2>
      <label>Data</label><input type="date" id="attDate">
      <div class="row"><div><label>Tipo</label><select id="attKind"><option>Tecnico</option><option>Tattico</option><option>Fisico</option><option>Partitella</option></select></div><div><label>Luogo</label><input type="text" id="attPlace"></div></div>
      <button class="btn sec" onclick="loadAttendance()">Carica / Compila</button>
    </div>
    <div class="card hidden" id="attCard"><h2>Segna presenze — <span id="attDateLbl"></span></h2>
      <div class="row" style="margin-bottom:8px"><button class="btn sec" style="margin:0" onclick="setAll(true)">Tutti presenti</button><button class="btn sec" style="margin:0" onclick="setAll(false)">Tutti assenti</button></div>
      <div id="attList"></div>
      <button class="btn ok" onclick="saveAttendance()">💾 Salva presenze</button><div id="attMsg"></div>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
